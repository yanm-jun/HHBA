<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHBA · 执行者主页</title>
<meta name="description" content="HHBA 执行者个人主页：技能认证、可靠分、历史评价。">
<style>
:root{
  --neon:#B2FC06; --grape:#8A3BEC; --ink:#1A0B2E;
  --bg:#FAFAF7; --card:#FFFFFF; --text:#1A0B2E;
  --muted:#5C5470; --faint:#8A8398; --border:#E8E4F0;
  --radius:16px; --err:#D64545; --ok:#2E9E5B;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7; overflow-x:hidden}
a{color:var(--grape); text-decoration:none}
.wrap{max-width:860px; margin:0 auto; padding:0 24px}
.nav{position:sticky; top:0; z-index:50; background:rgba(250,250,247,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border)}
.nav-inner{display:flex; align-items:center; justify-content:space-between; height:64px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; color:var(--text)}
.brand:hover{text-decoration:none}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--grape); color:#fff; display:grid; place-items:center; font-size:16px; font-weight:800}
.nav-links{display:flex; gap:28px; font-size:15px}
.nav-links a{color:var(--muted)}
.nav-links a:hover{color:var(--text)}
@media(max-width:720px){.nav-links{display:none}}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 26px; border-radius:12px; font-weight:600; font-size:15px; cursor:pointer; border:none; transition:all .18s ease}
.btn-primary{background:var(--grape); color:#fff}
.btn-primary:hover{background:#7A2FD6; transform:translateY(-1px); text-decoration:none}
.btn-outline{background:transparent; color:var(--grape); border:2px solid var(--grape)}
.btn-outline:hover{background:rgba(138,59,236,.06)}
.btn-sm{padding:8px 16px; font-size:13px}
/* profile hero */
.profile-hero{background:var(--card); border:1px solid var(--border); border-radius:20px; padding:36px; margin:32px 0 20px; display:flex; gap:28px; align-items:flex-start; box-shadow:0 8px 32px rgba(138,59,236,.06)}
@media(max-width:640px){.profile-hero{flex-direction:column; padding:28px 24px}}
.avatar{width:88px; height:88px; border-radius:50%; background:var(--grape); color:#fff; display:grid; place-items:center; font-weight:800; font-size:36px; flex:none}
.pinfo{flex:1}
.pinfo h1{font-size:28px; font-weight:800; letter-spacing:-.01em; margin-bottom:4px}
.pinfo .meta{font-size:14px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap}
.pinfo .meta span{display:flex; align-items:center; gap:4px}
.score-block{margin-top:16px}
.score-block .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
.score-block .num{font-size:32px; font-weight:800; color:var(--grape)}
.score-block .lbl{font-size:13px; color:var(--muted)}
.progress{height:10px; background:var(--border); border-radius:999px; overflow:hidden}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--grape),#a86ff0); border-radius:999px; transition:width .6s ease}
/* sections */
.section{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:28px; margin-bottom:20px}
.section h2{font-size:18px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px}
.section h2 .count{font-size:13px; font-weight:600; color:var(--faint); background:var(--bg); padding:2px 10px; border-radius:999px}
.skill-card{display:flex; align-items:center; gap:16px; padding:16px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; transition:all .15s}
.skill-card:hover{border-color:var(--grape)}
.skill-card:last-child{margin-bottom:0}
.skill-icon{width:48px; height:48px; border-radius:12px; background:rgba(138,59,236,.08); display:grid; place-items:center; font-size:24px; flex:none}
.skill-card .sinfo{flex:1}
.skill-card .sinfo b{font-size:15px}
.skill-card .sinfo p{font-size:13px; color:var(--muted); margin-top:2px}
.badge{font-size:12px; font-weight:700; padding:5px 14px; border-radius:999px; white-space:nowrap}
.badge.verified{background:var(--neon); color:var(--ink)}
.badge.self{background:rgba(138,59,236,.08); color:var(--grape); border:1px solid rgba(138,59,236,.2)}
.badge.task{background:rgba(46,158,91,.1); color:var(--ok); border:1px solid rgba(46,158,91,.25)}
.badge.none{background:var(--bg); color:var(--faint); border:1px solid var(--border)}
/* reviews */
.review{border-bottom:1px solid var(--border); padding:16px 0}
.review:last-child{border-bottom:none}
.review .rhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.review .score-stars{color:#F5A623; font-size:15px; letter-spacing:2px}
.review .rmeta{font-size:12px; color:var(--faint)}
.review p{font-size:14px; color:var(--muted); margin-top:4px}
.empty{text-align:center; color:var(--faint); padding:40px 20px; font-size:14px}
.foot{padding:36px 0; font-size:13px; color:var(--faint); border-top:1px solid var(--border); margin-top:48px}
.foot-inner{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
.cta-bar{position:sticky; bottom:0; background:rgba(250,250,247,.95); backdrop-filter:blur(12px); border-top:1px solid var(--border); padding:16px 0; margin-top:32px}
.cta-bar .wrap{display:flex; gap:12px; align-items:center}
.cta-bar p{flex:1; font-size:14px; color:var(--muted)}

/* 汉堡菜单（移动端） */
.nav-toggle{display:none; background:none; border:none; font-size:22px; cursor:pointer; color:var(--grape); padding:8px; line-height:1}
.nav-mobile{display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border-bottom:1px solid var(--border); box-shadow:0 8px 24px rgba(0,0,0,.08); z-index:60; padding:8px 0}
.nav-mobile.open{display:block}
.nav-mobile a{display:block; padding:12px 24px; font-size:15px; color:var(--ink); text-decoration:none}
.nav-mobile a:hover,.nav-mobile a:active{background:rgba(138,59,236,.06); color:var(--grape)}
.nav{position:relative}
@media(max-width:720px){.nav-toggle{display:block}.nav-inner>.btn{display:none}}
</style>
</head>
<body>

<nav class="nav"><div class="wrap nav-inner">
  <a class="brand" href="index.html"><span class="brand-mark">H</span>HHBA</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="菜单">☰</button>
    <div class="nav-mobile" id="nav-mobile">
      <a href="tasks.html">任务大厅</a>
      <a href="publish.html">发单</a>
      <a href="docs.html">开发者文档</a>
    </div>
  <div class="nav-links">
    <a href="tasks.html">任务大厅</a>
    <a href="publish.html">发单</a>
    <a href="docs.html">开发者文档</a>
  </div>
  <a class="btn btn-primary btn-sm" href="tasks.html" style="padding:8px 18px">去接单</a>
</div></nav>

<div class="wrap">
  <div id="profile-content">
    <div class="empty" style="margin-top:64px">加载中…</div>
  </div>
</div>

<div class="cta-bar" id="cta-bar" hidden><div class="wrap">
  <p>看中这位执行者？发单时可指定TA直接派单。</p>
  <a class="btn btn-primary btn-sm" id="cta-publish" href="publish.html">发单指定TA</a>
</div></div>

<footer class="foot"><div class="wrap foot-inner">
  <span><b>HHBA</b> · 执行者主页</span>
  <span>积分模拟阶段 · 不涉及真实资金结算</span>
</div></footer>

<script>
const $ = (s) => document.querySelector(s);
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '&gt;': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function fmtTime(iso) { if (!iso) return '–'; try { return new Date(iso).toLocaleDateString('zh-CN'); } catch { return iso; } }
function stars(score) {
  const n = Math.round(score || 0);
  return '★'.repeat(Math.min(n, 5)) + '☆'.repeat(Math.max(0, 5 - Math.min(n, 5)));
}
const SKILL_ICON = { h5_walkthrough: '📱', miniprogram_smoke: '🧪', sandbox_payment: '💳' };
const SOURCE_LABEL = { self: '自报', assessment: '测评认证', task: '实战积累' };

async function load() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) {
    $('#profile-content').innerHTML = '<div class="empty" style="margin-top:64px">缺少执行者 ID。<br><a href="tasks.html">回任务大厅</a></div>';
    return;
  }
  try {
    const [rep, skills] = await Promise.all([
      fetch(`/api/executors/${encodeURIComponent(id)}/reputation`).then((r) => { if (!r.ok) throw new Error('执行者不存在'); return r.json(); }),
      fetch(`/api/executors/${encodeURIComponent(id)}/skills`).then((r) => r.ok ? r.json() : { skills: [] }),
    ]);
    render(rep, skills.skills || [], id);
  } catch (e) {
    $('#profile-content').innerHTML = `<div class="empty" style="margin-top:64px">${esc(e.message)}<br><a href="tasks.html">回任务大厅</a></div>`;
  }
}

function render(rep, skills, id) {
  const name = rep.displayName || id;
  const score = rep.reliabilityScore ?? 100;
  const scorePct = Math.min(100, Math.max(0, (score / 120) * 100));
  const comp = rep.composite || {};
  const goodRate = comp.public && comp.public.count
    ? Math.round((comp.public.average / 5) * 100) : null;

  const skillMap = {};
  skills.forEach((s) => { skillMap[s.tag] = s; });

  const skillTags = [
    { tag: 'h5_walkthrough', name: 'H5 / 落地页真机走查', desc: '在真实手机上走查页面，截图回传' },
    { tag: 'miniprogram_smoke', name: '小程序 / App 冒烟测试', desc: '按用例跑核心流程，记录问题' },
    { tag: 'sandbox_payment', name: '沙箱表单 / 支付链路验证', desc: '沙箱环境走完支付全链路' },
  ];
  const skillHTML = skillTags.map((t) => {
    const s = skillMap[t.tag];
    let badge;
    if (s && s.verified) badge = `<span class="badge verified">✓ 已认证 Lv.${s.level}</span>`;
    else if (s && s.source === 'task') badge = `<span class="badge task">实战 Lv.${s.level}</span>`;
    else if (s) badge = `<span class="badge self">自报 Lv.${s.level}</span>`;
    else badge = `<span class="badge none">未申报</span>`;
    return `<div class="skill-card">
      <div class="skill-icon">${SKILL_ICON[t.tag] || '🔧'}</div>
      <div class="sinfo"><b>${esc(t.name)}</b><p>${esc(t.desc)}${s ? ` · ${SOURCE_LABEL[s.source] || s.source}` : ''}</p></div>
      ${badge}
    </div>`;
  }).join('');

  const reviews = (rep.publicFeedbacks || []).slice(0, 10);
  const reviewHTML = reviews.length ? reviews.map((fb) => `
    <div class="review">
      <div class="rhead">
        <span class="score-stars">${stars(fb.publicScore)}</span>
        <span class="rmeta">${esc(fmtTime(fb.createdAt))} · ${fb.taskAmount ? esc(fb.taskAmount) + '积分' : ''}</span>
      </div>
      ${fb.publicComment ? `<p>${esc(fb.publicComment)}</p>` : '<p style="color:var(--faint)">（无文字评价）</p>'}
    </div>`).join('')
    : '<div class="empty">暂无公开评价</div>';

  const joinedDate = rep.createdAt ? fmtTime(rep.createdAt) : '–';

  $('#profile-content').innerHTML = `
    <div class="profile-hero">
      <div class="avatar">${esc(name.slice(0, 1))}</div>
      <div class="pinfo">
        <h1>${esc(name)}</h1>
        <div class="meta">
          <span>📅 ${esc(joinedDate)} 加入</span>
          <span>✅ 完成 ${rep.completedTasks ?? comp.fulfillment?.completedTasks ?? 0} 单</span>
          ${goodRate != null ? `<span>⭐ 好评率 ${goodRate}%</span>` : ''}
        </div>
        <div class="score-block">
          <div class="row"><span class="num">${score}</span><span class="lbl">可靠分 / 120</span></div>
          <div class="progress"><i style="width:${scorePct}%"></i></div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>技能认证 <span class="count">${skills.filter((s) => s.verified).length} 已认证</span></h2>
      ${skillHTML}
    </div>

    <div class="section">
      <h2>历史评价 <span class="count">${reviews.length}</span></h2>
      ${reviewHTML}
    </div>`;

  $('#cta-bar').hidden = false;
  $('#cta-publish').href = 'publish.html?executor=' + encodeURIComponent(id);
  document.title = `${name} · HHBA 执行者`;
}

load();
</script>

<script>
(function(){
  var t = document.getElementById('nav-toggle');
  var m = document.getElementById('nav-mobile');
  if (!t || !m) return;
  t.addEventListener('click', function(e){ e.stopPropagation(); m.classList.toggle('open'); });
  document.addEventListener('click', function(e){ if (!m.contains(e.target)) m.classList.remove('open'); });
})();
</script>
</body>
</html>
