<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHBA · 发一单</title>
<meta name="description" content="HHBA 发单：在规则内让 AI 自动找人把活干完。积分模拟阶段，不涉及真实资金。">
<style>
:root{
  --neon:#B2FC06; --grape:#8A3BEC; --ink:#1A0B2E;
  --bg:#FAFAF7; --card:#FFFFFF; --text:#1A0B2E;
  --muted:#5C5470; --faint:#8A8398; --border:#E8E4F0;
  --radius:16px; --err:#D64545; --ok:#2E9E5B; --warn:#C77B1A;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.7; overflow-x:hidden}
a{color:var(--grape); text-decoration:none}
.wrap{max-width:860px; margin:0 auto; padding:0 24px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
/* nav */
.nav{position:sticky; top:0; z-index:50; background:rgba(250,250,247,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border)}
.nav-inner{display:flex; align-items:center; justify-content:space-between; height:64px}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; color:var(--text)}
.brand:hover{text-decoration:none}
.brand-mark{width:32px; height:32px; border-radius:10px; background:var(--grape); color:#fff; display:grid; place-items:center; font-size:16px; font-weight:800}
.nav-links{display:flex; gap:28px; font-size:15px; align-items:center}
.nav-links a{color:var(--muted)}
.nav-links a:hover,.nav-links a.active{color:var(--text); font-weight:600}
@media(max-width:720px){.nav-links{display:none}}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 26px; border-radius:12px; font-weight:600; font-size:15px; cursor:pointer; border:none; transition:all .18s ease}
.btn-primary{background:var(--grape); color:#fff}
.btn-primary:hover{background:#7A2FD6; transform:translateY(-1px); text-decoration:none}
.btn-outline{background:transparent; color:var(--grape); border:2px solid var(--grape)}
.btn-outline:hover{background:rgba(138,59,236,.06)}
.btn-ghost{background:var(--bg); color:var(--muted); border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--grape); color:var(--text)}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none}
.btn-sm{padding:8px 16px; font-size:13px}
/* steps */
.steps-bar{display:flex; gap:0; margin:36px 0 32px}
.step-ind{flex:1; text-align:center; position:relative; font-size:13px; color:var(--faint)}
.step-ind .dot{width:32px; height:32px; border-radius:50%; background:var(--card); border:2px solid var(--border); display:grid; place-items:center; margin:0 auto 8px; font-weight:700; font-size:14px; color:var(--faint); transition:all .2s}
.step-ind.done .dot{background:var(--grape); border-color:var(--grape); color:#fff}
.step-ind.now .dot{border-color:var(--grape); color:var(--grape); box-shadow:0 0 0 4px rgba(138,59,236,.12)}
.step-ind.now{color:var(--text); font-weight:600}
.step-ind:not(:last-child)::after{content:""; position:absolute; top:16px; left:calc(50% + 20px); right:calc(-50% + 20px); height:2px; background:var(--border)}
.step-ind.done:not(:last-child)::after{background:var(--grape)}
/* cards */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:32px; margin-bottom:20px}
.card h2{font-size:22px; font-weight:800; margin-bottom:6px}
.card .sub{color:var(--muted); font-size:14px; margin-bottom:24px}
.tpl-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
@media(max-width:640px){.tpl-grid{grid-template-columns:1fr}}
.tpl-card{border:2px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; transition:all .18s ease; text-align:left; background:var(--card); padding:0}
.tpl-card:hover{border-color:var(--grape); transform:translateY(-2px); box-shadow:0 10px 28px rgba(138,59,236,.1)}
.tpl-card.sel{border-color:var(--grape); box-shadow:0 0 0 3px rgba(138,59,236,.15)}
.tpl-card img{width:100%; aspect-ratio:16/9; object-fit:cover; display:block}
.tpl-card .tb{padding:18px}
.tpl-card h3{font-size:16px; font-weight:700; margin-bottom:6px}
.tpl-card p{font-size:13px; color:var(--muted); line-height:1.6}
.tpl-card .range{font-size:12px; color:var(--grape); font-weight:600; margin-top:8px}
.tpl-custom{display:flex; align-items:center; gap:14px; padding:20px}
.tpl-custom .ic{width:48px; height:48px; border-radius:12px; background:rgba(138,59,236,.08); display:grid; place-items:center; font-size:22px; flex-shrink:0}
/* form */
label.f{display:block; font-size:13px; font-weight:600; margin:20px 0 8px; color:var(--muted)}
label.f .req{color:var(--err)}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--grape); box-shadow:0 0 0 3px rgba(138,59,236,.1)}
textarea{resize:vertical; min-height:110px}
.crit-list{display:flex; flex-direction:column; gap:10px; margin-bottom:10px}
.crit-row{display:flex; gap:10px; align-items:center}
.crit-row input{flex:1}
.crit-del{background:none; border:none; color:var(--faint); font-size:18px; padding:6px 10px; border-radius:8px}
.crit-del:hover{color:var(--err); background:rgba(214,69,69,.06)}
.skill-picks{display:flex; gap:10px; flex-wrap:wrap}
.skill-pick{border:1.5px solid var(--border); border-radius:999px; padding:8px 18px; font-size:13px; cursor:pointer; background:var(--card); transition:all .15s}
.skill-pick.sel{border-color:var(--grape); background:rgba(138,59,236,.08); color:var(--grape); font-weight:600}
/* budget */
.balance-card{display:flex; justify-content:space-between; align-items:center; background:var(--ink); color:#fff; border-radius:14px; padding:20px 24px; margin-bottom:20px}
.balance-card .amt{font-size:32px; font-weight:800; color:var(--neon)}
.balance-card .lbl{font-size:13px; color:rgba(255,255,255,.65)}
.budget-hint{font-size:13px; color:var(--muted); margin-top:8px}
.budget-hint.bad{color:var(--err); font-weight:600}
/* review */
.review-row{display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px}
.review-row:last-child{border:none}
.review-row .k{color:var(--muted); flex-shrink:0}
.review-row .v{text-align:right; font-weight:500}
.policy-ok{background:rgba(46,158,91,.08); border:1px solid rgba(46,158,91,.3); border-radius:12px; padding:16px 20px; font-size:14px; color:var(--ok); margin:16px 0}
.policy-warn{background:rgba(199,123,26,.08); border:1px solid rgba(199,123,26,.35); border-radius:12px; padding:16px 20px; font-size:14px; color:var(--warn); margin:16px 0}
/* nav buttons */
.wiz-nav{display:flex; justify-content:space-between; gap:12px; margin:28px 0 72px}
/* result */
.result{text-align:center; padding:64px 32px}
.result .big-ic{width:72px; height:72px; border-radius:50%; background:rgba(46,158,91,.1); display:grid; place-items:center; font-size:34px; margin:0 auto 20px}
.result h2{font-size:28px; font-weight:800; margin-bottom:12px}
.result p{color:var(--muted); margin-bottom:8px}
.result .task-id{font-family:monospace; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 16px; display:inline-block; margin:12px 0 24px; font-size:14px}
.notice{min-height:22px; margin-top:12px; font-size:13px}
.notice.error{color:var(--err)}
.login-wall{max-width:480px; margin:72px auto; text-align:center}
.login-wall .card{padding:48px 36px}
footer{border-top:1px solid var(--border); padding:28px 0; margin-top:40px; font-size:13px; color:var(--faint); text-align:center}
.hidden{display:none !important}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-inner">
  <a class="brand" href="index.html"><span class="brand-mark">H</span>HHBA</a>
  <div class="nav-links">
    <a href="tasks.html">任务大厅</a>
    <a href="publish.html" class="active">发单</a>
    <a href="docs.html">开发者文档</a>
  </div>
  <a class="btn btn-primary btn-sm" href="tasks.html" style="padding:10px 22px">任务大厅</a>
</div></nav>

<div class="wrap" id="login-wall" hidden>
  <div class="login-wall"><div class="card">
    <h2 style="font-size:24px;font-weight:800;margin-bottom:12px">发单需要先登录</h2>
    <p style="color:var(--muted);font-size:14px;margin-bottom:24px">登录后才能创建任务、冻结积分、跟踪进度。</p>
    <a class="btn btn-primary" href="tasks.html">去登录 / 注册</a>
  </div></div>
</div>

<div class="wrap hidden" id="wizard">
  <div class="steps-bar" id="steps-bar">
    <div class="step-ind now" data-s="1"><div class="dot">1</div>选模板</div>
    <div class="step-ind" data-s="2"><div class="dot">2</div>填需求</div>
    <div class="step-ind" data-s="3"><div class="dot">3</div>定预算</div>
    <div class="step-ind" data-s="4"><div class="dot">4</div>确认发布</div>
  </div>

  <!-- Step 1: 选模板 -->
  <div class="card" id="step-1">
    <h2>选个任务模板</h2>
    <p class="sub">模板带好了能力要求和验收标准，你只管填需求。</p>
    <div class="tpl-grid" id="tpl-grid"></div>
    <div style="margin-top:16px">
      <button class="tpl-card tpl-custom" id="tpl-custom" style="width:100%">
        <div class="ic">✦</div>
        <div><h3>自定义任务</h3><p>不走模板，自己写需求和验收标准</p></div>
      </button>
    </div>
  </div>

  <!-- Step 2: 填需求 -->
  <div class="card hidden" id="step-2">
    <h2>填需求</h2>
    <p class="sub" id="step2-tpl-name"></p>
    <label class="f">任务标题 <span class="req">*</span></label>
    <input type="text" id="f-goal" placeholder="一句话说清要干什么，例如：帮我走查一遍落地页">
    <label class="f">任务描述 <span class="req">*</span></label>
    <textarea id="f-desc" placeholder="详细描述背景、要验证的页面/流程、注意事项"></textarea>
    <label class="f">验收标准 <span class="req">*</span></label>
    <div class="crit-list" id="crit-list"></div>
    <button class="btn btn-ghost btn-sm" id="crit-add">+ 加一条</button>
    <label class="f">截止时间 <span class="req">*</span></label>
    <input type="datetime-local" id="f-deadline">
    <label class="f">所需技能</label>
    <div class="skill-picks" id="skill-picks"></div>
  </div>

  <!-- Step 3: 定预算 -->
  <div class="card hidden" id="step-3">
    <h2>定预算</h2>
    <p class="sub">发布时积分会冻结在平台，验收通过才结算给执行者。</p>
    <div class="balance-card">
      <div><div class="lbl">当前积分余额</div><div class="amt" id="balance-amt">…</div></div>
      <div class="lbl" id="balance-escrow"></div>
    </div>
    <label class="f">任务预算（积分） <span class="req">*</span></label>
    <input type="number" id="f-budget" min="1" placeholder="输入积分数量">
    <div class="budget-hint" id="budget-hint"></div>
  </div>

  <!-- Step 4: 确认 -->
  <div class="card hidden" id="step-4">
    <h2>确认发布</h2>
    <p class="sub">检查一遍，没问题就发布。</p>
    <div id="review-box"></div>
    <div id="policy-box"></div>
    <div class="notice" id="pub-notice"></div>
  </div>

  <div class="wiz-nav">
    <button class="btn btn-ghost" id="btn-prev">← 上一步</button>
    <button class="btn btn-primary" id="btn-next">下一步 →</button>
  </div>
</div>

<div class="wrap hidden" id="result">
  <div class="card result">
    <div class="big-ic">✓</div>
    <h2>发布成功</h2>
    <p>任务已进入匹配池，HHBA 正在为你找执行者。</p>
    <div class="task-id" id="result-id"></div>
    <div><a class="btn btn-primary" href="tasks.html">去任务大厅查看</a></div>
  </div>
</div>

<footer>HHBA · 积分模拟阶段 · 不涉及真实资金结算</footer>

<script>
const $ = (s) => document.querySelector(s);
async function api(path, init = {}) {
  const res = await fetch(path, { credentials: 'include', ...init, headers: { 'Content-Type': 'application/json', ...(init.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.error || '操作失败，请重试'); e.status = res.status; e.body = body; throw e; }
  return body;
}
function esc(s) { return String(s ?? '').replace(/[&<>\"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '&gt;': '&gt;', '\"': '&quot;', "'": '&#39;' }[c])); }

const TPL_IMGS = { tpl_h5_walkthrough: 'assets/tpl-h5.webp', tpl_miniprogram_smoke: 'assets/tpl-miniprogram.webp', tpl_sandbox_payment: 'assets/tpl-payment.webp' };
const state = { step: 1, templates: [], skillTags: [], tpl: null, custom: false, balance: 0, skills: [] };

function setStep(n) {
  state.step = n;
  document.querySelectorAll('.step-ind').forEach(el => {
    const s = Number(el.dataset.s);
    el.classList.toggle('now', s === n);
    el.classList.toggle('done', s < n);
    el.querySelector('.dot').textContent = s < n ? '✓' : s;
  });
  [1,2,3,4].forEach(i => $('#step-' + i).classList.toggle('hidden', i !== n));
  $('#btn-prev').style.visibility = n === 1 ? 'hidden' : 'visible';
  $('#btn-next').textContent = n === 4 ? '确认发布' : '下一步 →';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function init() {
  let me;
  try { me = await api('/api/auth/me'); } catch {}
  if (!me || !me.user) { $('#login-wall').hidden = false; return; }
  $('#login-wall').hidden = true;
  $('#wizard').classList.remove('hidden');
  const [tplRes, tagRes, balRes] = await Promise.all([
    api('/api/task-templates').catch(() => ({ templates: [] })),
    api('/api/skill-tags').catch(() => ({ tags: [] })),
    api('/api/boss/balance').catch(() => null),
  ]);
  state.templates = tplRes.templates || [];
  state.skillTags = tagRes.tags || [];
  if (balRes) state.balance = balRes.balance;
  renderTemplates(); renderSkills();
  $('#balance-amt').textContent = balRes ? balRes.balance + ' 分' : '—';
  $('#balance-escrow').textContent = balRes ? '冻结中 ' + balRes.escrow + ' 分' : '';
  setStep(1);
}

function renderTemplates() {
  const grid = $('#tpl-grid'); grid.innerHTML = '';
  state.templates.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tpl-card'; b.type = 'button';
    b.innerHTML = `<img src="${TPL_IMGS[t.id] || ''}" alt="${esc(t.name)}" loading="lazy" onerror="this.style.display='none'">
      <div class="tb"><h3>${esc(t.name)}</h3><p>${esc(t.description || '')}</p>
      <div class="range">建议预算 ${t.suggestedBudget ? t.suggestedBudget.min + '–' + t.suggestedBudget.max : '—'} 积分</div></div>`;
    b.onclick = () => selectTemplate(t, b);
    grid.appendChild(b);
  });
}
function selectTemplate(t, el) {
  state.tpl = t; state.custom = false;
  document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('sel'));
  el.classList.add('sel'); $('#tpl-custom').classList.remove('sel');
  prefillFromTemplate(t);
}
function prefillFromTemplate(t) {
  $('#step2-tpl-name').textContent = '模板：' + t.name;
  if (!$('#f-goal').value) $('#f-goal').value = t.name + '：';
  renderCriteria(t.acceptanceCriteria || []);
  const tag = state.skillTags.find(s => s.templateId === t.id);
  state.skills = tag ? [tag.tag] : [];
  renderSkills();
  if (t.suggestedBudget && !$('#f-budget').value) $('#f-budget').value = t.suggestedBudget.min;
  updateBudgetHint();
}
$('#tpl-custom').onclick = () => {
  state.tpl = null; state.custom = true;
  document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('sel'));
  $('#tpl-custom').classList.add('sel');
  $('#step2-tpl-name').textContent = '自定义任务';
  renderCriteria(['']);
  state.skills = []; renderSkills();
  updateBudgetHint();
};

function renderCriteria(list) {
  const box = $('#crit-list'); box.innerHTML = '';
  (list.length ? list : ['']).forEach(c => addCriterion(c));
}
function addCriterion(val = '') {
  const row = document.createElement('div'); row.className = 'crit-row';
  row.innerHTML = `<input type="text" placeholder="例如：在 iPhone 上打开无白屏" value="${esc(val)}"><button class="crit-del" type="button" title="删除">×</button>`;
  row.querySelector('.crit-del').onclick = () => { row.remove(); };
  $('#crit-list').appendChild(row);
}
$('#crit-add').onclick = () => addCriterion();

function renderSkills() {
  const box = $('#skill-picks'); box.innerHTML = '';
  state.skillTags.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'skill-pick' + (state.skills.includes(s.tag) ? ' sel' : '');
    b.textContent = s.name;
    b.onclick = () => {
      const i = state.skills.indexOf(s.tag);
      if (i >= 0) state.skills.splice(i, 1); else state.skills.push(s.tag);
      renderSkills();
    };
    box.appendChild(b);
  });
}

function updateBudgetHint() {
  const hint = $('#budget-hint');
  const v = Number($('#f-budget').value);
  const t = state.tpl;
  if (t && t.suggestedBudget) hint.textContent = `模板建议范围 ${t.suggestedBudget.min}–${t.suggestedBudget.max} 积分`;
  else hint.textContent = '';
  hint.classList.remove('bad');
  if (v > 0 && v > state.balance) { hint.textContent = `余额不足：需要 ${v} 分，当前只有 ${state.balance} 分（积分模拟阶段，请联系平台充值）`; hint.classList.add('bad'); }
}
$('#f-budget').addEventListener('input', updateBudgetHint);

function validate(step) {
  if (step === 1 && !state.tpl && !state.custom) { alert('请先选一个模板，或选自定义任务'); return false; }
  if (step === 2) {
    if (!$('#f-goal').value.trim()) { alert('请填写任务标题'); return false; }
    if (!$('#f-desc').value.trim()) { alert('请填写任务描述'); return false; }
    const crits = [...$('#crit-list').querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
    if (!crits.length) { alert('请至少填写一条验收标准'); return false; }
    if (!$('#f-deadline').value) { alert('请选择截止时间'); return false; }
  }
  if (step === 3) {
    const v = Number($('#f-budget').value);
    if (!v || v <= 0) { alert('请填写有效的预算'); return false; }
    if (v > state.balance) { alert('积分余额不足，无法发布'); return false; }
  }
  return true;
}

function renderReview() {
  const crits = [...$('#crit-list').querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
  const skillNames = state.skills.map(t => (state.skillTags.find(s => s.tag === t) || {}).name || t);
  $('#review-box').innerHTML = `
    <div class="review-row"><span class="k">任务类型</span><span class="v">${esc(state.custom ? '自定义任务' : (state.tpl ? state.tpl.name : ''))}</span></div>
    <div class="review-row"><span class="k">标题</span><span class="v">${esc($('#f-goal').value.trim())}</span></div>
    <div class="review-row"><span class="k">验收标准</span><span class="v">${crits.length} 条</span></div>
    <div class="review-row"><span class="k">截止时间</span><span class="v">${esc($('#f-deadline').value.replace('T', ' '))}</span></div>
    <div class="review-row"><span class="k">所需技能</span><span class="v">${esc(skillNames.join('、') || '无')}</span></div>
    <div class="review-row"><span class="k">预算</span><span class="v" style="color:var(--grape);font-weight:700">${esc($('#f-budget').value)} 积分</span></div>`;
}

async function doPublish() {
  const notice = $('#pub-notice'); notice.textContent = ''; notice.className = 'notice';
  const btn = $('#btn-next'); btn.disabled = true; btn.textContent = '发布中…';
  try {
    const goal = $('#f-goal').value.trim();
    const desc = $('#f-desc').value.trim();
    const crits = [...$('#crit-list').querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
    const budget = Number($('#f-budget').value);
    const deadline = new Date($('#f-deadline').value).toISOString();
    let draft;
    if (!state.custom && state.tpl) {
      draft = await api('/api/human-capability-requests/from-template', { method: 'POST',
        body: JSON.stringify({ templateId: state.tpl.id, goal, budget, deadline,
          humanGapReason: desc, acceptanceCriteria: crits, requiredSkills: state.skills }) });
    } else {
      draft = await api('/api/human-capability-requests/draft', { method: 'POST',
        body: JSON.stringify({ goal, foreman: { tool: 'hhba-web-manual' },
          human_gap: { type: 'DIGITAL_EXECUTION', reason: desc },
          capability_requirements: ['拥有可正常上网的真实手机', '能按检查清单验证并截图'],
          acceptance_criteria: crits, budget, deadline, requiredSkills: state.skills }) });
    }
    if (draft.budgetWarning) notice.textContent = '提示：' + draft.budgetWarning;
    // 发布
    try {
      const pub = await api('/api/human-capability-requests/' + draft.id + '/publish', { method: 'POST' });
      $('#result-id').textContent = '任务 ID：' + pub.requestId;
      $('#wizard').classList.add('hidden');
      document.querySelector('.wiz-nav').style.display = 'none';
      $('#result').classList.remove('hidden');
      window.scrollTo({ top: 0 });
    } catch (e) {
      if (e.status === 403 && e.body && e.body.approvalRequired) {
        // 需人工确认 → 跳 approve.html
        location.href = 'approve.html?approve=' + encodeURIComponent(draft.id);
        return;
      }
      throw e;
    }
  } catch (e) {
    notice.textContent = e.message; notice.classList.add('error');
  } finally {
    btn.disabled = false; btn.textContent = '确认发布';
  }
}

$('#btn-next').onclick = async () => {
  if (state.step < 4) {
    if (!validate(state.step)) return;
    if (state.step === 3) renderReview();
    setStep(state.step + 1);
  } else {
    if (!validate(3)) { setStep(3); return; }
    await doPublish();
  }
};
$('#btn-prev').onclick = () => { if (state.step > 1) setStep(state.step - 1); };

init();
</script>
</body>
</html>
